name: Package VS Code Extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Compile
        run: npm run compile || echo "skip compile if prebuilt"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package
        run: vsce package -o fold-functions-extension.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fold-functions-extension
          path: fold-functions-extension.vsix
